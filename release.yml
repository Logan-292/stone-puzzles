name: Release

# Релиз создаётся при пуше тега вида v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить синтаксис скриптов
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done

      - name: Прописать версию и ссылки в module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" --arg repo "$GITHUB_REPOSITORY" '
            .version = $v
            | .url = "https://github.com/\($repo)"
            | .manifest = "https://github.com/\($repo)/releases/latest/download/module.json"
            | .download = "https://github.com/\($repo)/releases/download/v\($v)/module.zip"
            | .bugs = "https://github.com/\($repo)/issues"
          ' module.json > module.tmp
          mv module.tmp module.json
          cat module.json

      - name: Собрать архив модуля
        run: zip -r module.zip module.json scripts styles README.md LICENSE CHANGELOG.md

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
